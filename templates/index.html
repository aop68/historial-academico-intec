<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador – Historial Académico Estudiantil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-intec mb-4">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold fs-6">
      <i class="bi bi-mortarboard-fill me-2"></i>
      Instituto Tecnológico de Santo Domingo — Historial Académico Estudiantil
    </span>
  </div>
</nav>

<div class="container-lg pb-5">

  <!-- ── Student info ─────────────────────────────────────────────── -->
  <div class="card shadow-sm mb-4">
    <div class="card-header section-header">
      <i class="bi bi-person-badge me-2"></i>Datos del Estudiante
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label fw-semibold">ID</label>
          <input type="text" name="id" id="id" class="form-control" placeholder="1133825">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Matrícula</label>
          <input type="text" name="matricula" id="matricula" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nombre</label>
          <input type="text" name="nombre" id="nombre" class="form-control" placeholder="APELLIDO NOMBRE">
        </div>
        <div class="col-md-8">
          <label class="form-label fw-semibold">Programa</label>
          <input type="text" name="programa" id="programa" class="form-control"
                 placeholder="(LIF-2020) LICENCIATURA EN INGENIERÍA FINANCIERA (LIF)">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Cond. Ac.</label>
          <input type="text" name="cond_ac" id="cond_ac" class="form-control" placeholder="EN PROCESO">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Estatus</label>
          <input type="text" name="estatus" id="estatus" class="form-control" placeholder="ACTIVO EN PROGRAMA">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Créditos Convalidados</label>
          <input type="number" name="cred_convalidados" id="cred_convalidados" class="form-control" placeholder="13">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Créditos Aprobados</label>
          <input type="number" name="cred_aprobados" id="cred_aprobados" class="form-control" placeholder="11">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Créditos del Programa</label>
          <input type="number" name="cred_programa" id="cred_programa" class="form-control" placeholder="237">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Asignaturas Aprobadas</label>
          <input type="number" name="asig_aprobadas" id="asig_aprobadas" class="form-control" placeholder="11">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Total Asignaturas del Programa</label>
          <input type="number" name="asig_total" id="asig_total" class="form-control" placeholder="74">
        </div>
      </div>
    </div>
  </div>

  <!-- ── Trimesters container ────────────────────────────────────── -->
  <div id="trimesters-container"></div>

  <!-- ── Add trimester button ───────────────────────────────────── -->
  <div class="d-flex gap-2 mb-4">
    <button type="button" class="btn btn-outline-primary" onclick="addTrimester()">
      <i class="bi bi-plus-circle me-1"></i>Agregar Trimestre
    </button>
    <button type="button" class="btn btn-success btn-lg ms-auto" onclick="submitForm()">
      <i class="bi bi-file-earmark-pdf me-1"></i>Generar PDF
    </button>
  </div>

</div>

<!-- Hidden form for submission -->
<form id="hidden-form" method="POST" action="/generar" style="display:none">
  <input type="hidden" name="id">
  <input type="hidden" name="matricula">
  <input type="hidden" name="nombre">
  <input type="hidden" name="programa">
  <input type="hidden" name="cond_ac">
  <input type="hidden" name="estatus">
  <input type="hidden" name="cred_convalidados">
  <input type="hidden" name="cred_aprobados">
  <input type="hidden" name="cred_programa">
  <input type="hidden" name="asig_aprobadas">
  <input type="hidden" name="asig_total">
  <input type="hidden" name="trimesters_data" id="trimesters_data">
</form>

<!-- Trimester template (hidden) -->
<template id="trimester-tpl">
  <div class="card shadow-sm mb-3 trimester-card" data-index="__IDX__">
    <div class="card-header section-header d-flex align-items-center gap-2">
      <i class="bi bi-calendar3 me-1"></i>
      <span class="fw-bold">Trimestre __NUM__</span>
      <button type="button" class="btn btn-sm btn-outline-danger ms-auto"
              onclick="removeTrimester(this)">
        <i class="bi bi-trash"></i> Eliminar
      </button>
    </div>
    <div class="card-body">
      <!-- Period -->
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Período (ej: NOVIEMBRE 2025 - ENERO 2026)</label>
          <input type="text" class="form-control trim-periodo"
                 placeholder="NOVIEMBRE 2025 - ENERO 2026">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Condición Académica</label>
          <input type="text" class="form-control trim-condicion" placeholder="CONDICIÓN NORMAL">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Descripción Observación</label>
          <input type="text" class="form-control trim-descripcion" placeholder="CONDICIÓN NORMAL">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Índice Trimestral</label>
          <input type="text" class="form-control trim-indice-trim" placeholder="2,50">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Índice Acumulado</label>
          <input type="text" class="form-control trim-indice-acum" placeholder="2,50">
        </div>
      </div>

      <!-- Subjects table -->
      <div class="table-responsive">
        <table class="table table-sm table-bordered subjects-table mb-2">
          <thead class="table-light">
            <tr>
              <th style="width:90px">Clave</th>
              <th style="width:55px">Sec</th>
              <th>Nombre de la Asignatura</th>
              <th style="width:65px">Calif.</th>
              <th style="width:50px">CR</th>
              <th style="width:70px">Puntos</th>
              <th style="width:40px"></th>
            </tr>
          </thead>
          <tbody class="subjects-body">
          </tbody>
        </table>
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addSubject(this)">
        <i class="bi bi-plus me-1"></i>Agregar Asignatura
      </button>
    </div>
  </div>
</template>

<!-- Subject row template -->
<template id="subject-tpl">
  <tr>
    <td><input type="text" class="form-control form-control-sm subj-clave" placeholder="AHC109"></td>
    <td><input type="text" class="form-control form-control-sm subj-sec" placeholder="00"></td>
    <td><input type="text" class="form-control form-control-sm subj-nombre" placeholder="NOMBRE DE LA ASIGNATURA"></td>
    <td><input type="text" class="form-control form-control-sm subj-calif" placeholder="A"></td>
    <td><input type="number" class="form-control form-control-sm subj-cr" placeholder="4" min="0"></td>
    <td><input type="text" class="form-control form-control-sm subj-puntos" placeholder="0,0"></td>
    <td>
      <button type="button" class="btn btn-sm btn-outline-danger w-100"
              onclick="this.closest('tr').remove()">
        <i class="bi bi-x"></i>
      </button>
    </td>
  </tr>
</template>

<script>
  let trimesterCount = 0;

  function addTrimester() {
    trimesterCount++;
    const tpl = document.getElementById('trimester-tpl').content.cloneNode(true);
    const card = tpl.querySelector('.trimester-card');
    card.dataset.index = trimesterCount;
    card.querySelector('.fw-bold').textContent = `Trimestre ${trimesterCount}`;
    document.getElementById('trimesters-container').appendChild(tpl);
    // Auto-add one subject row
    const btn = document.getElementById('trimesters-container').lastElementChild
                  .querySelector('[onclick="addSubject(this)"]');
    addSubject(btn);
  }

  function removeTrimester(btn) {
    btn.closest('.trimester-card').remove();
    renumberTrimesters();
  }

  function renumberTrimesters() {
    document.querySelectorAll('.trimester-card').forEach((card, i) => {
      card.querySelector('.fw-bold').textContent = `Trimestre ${i + 1}`;
    });
  }

  function addSubject(btn) {
    const tbody = btn.closest('.card-body').querySelector('.subjects-body');
    const tpl = document.getElementById('subject-tpl').content.cloneNode(true);
    tbody.appendChild(tpl);
  }

  function collectTrimesters() {
    const trimesters = [];
    document.querySelectorAll('.trimester-card').forEach(card => {
      const subjects = [];
      card.querySelectorAll('.subjects-body tr').forEach(row => {
        subjects.push({
          clave:  row.querySelector('.subj-clave').value.trim(),
          sec:    row.querySelector('.subj-sec').value.trim(),
          nombre: row.querySelector('.subj-nombre').value.trim(),
          calif:  row.querySelector('.subj-calif').value.trim(),
          cr:     row.querySelector('.subj-cr').value.trim(),
          puntos: row.querySelector('.subj-puntos').value.trim() || '0,0',
        });
      });
      trimesters.push({
        periodo:           card.querySelector('.trim-periodo').value.trim(),
        condicion:         card.querySelector('.trim-condicion').value.trim(),
        descripcion:       card.querySelector('.trim-descripcion').value.trim(),
        indice_trimestral: card.querySelector('.trim-indice-trim').value.trim(),
        indice_acumulado:  card.querySelector('.trim-indice-acum').value.trim(),
        subjects,
      });
    });
    return trimesters;
  }

  function copyField(name) {
    const src = document.getElementById(name);
    const dst = document.querySelector(`#hidden-form [name="${name}"]`);
    if (src && dst) dst.value = src.value;
  }

  function submitForm() {
    const fieldNames = [
      'id','matricula','nombre','programa','cond_ac','estatus',
      'cred_convalidados','cred_aprobados','cred_programa',
      'asig_aprobadas','asig_total'
    ];
    fieldNames.forEach(copyField);
    document.getElementById('trimesters_data').value =
      JSON.stringify(collectTrimesters());
    document.getElementById('hidden-form').submit();
  }

  // Start with one trimester open
  addTrimester();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
